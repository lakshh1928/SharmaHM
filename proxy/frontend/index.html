<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceOS // Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-gray-900 via-[#050505] to-black">
    
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex items-center gap-8 border-b border-white/10">
        <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">SYS.FINANCE</h1>
        <div class="flex gap-6 text-sm font-semibold tracking-wide">
            <button onclick="showTab('dashboard')" class="hover:text-cyan-400 transition-colors">DASHBOARD</button>
            <button onclick="showTab('properties')" class="hover:text-cyan-400 transition-colors">PROPERTIES</button>
            <button onclick="showTab('emis')" class="hover:text-cyan-400 transition-colors">LIABILITIES</button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto mt-10 p-4">
        
        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content animate-fade-in">
            <h2 class="text-3xl font-light tracking-wide mb-8">System <span class="font-bold glow-text text-cyan-400">Overview</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-8 rounded-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-all group-hover:bg-cyan-500/20"></div>
                    <p class="text-gray-400 text-xs font-bold tracking-widest uppercase mb-2">Inbound Revenue</p>
                    <p class="text-5xl font-bold text-cyan-400 tracking-tighter">₹<span id="dash-rent">0</span></p>
                </div>
                
                <div class="glass p-8 rounded-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-rose-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-all group-hover:bg-rose-500/20"></div>
                    <p class="text-gray-400 text-xs font-bold tracking-widest uppercase mb-2">Outbound Obligations</p>
                    <p class="text-5xl font-bold text-rose-500 tracking-tighter">₹<span id="dash-emi">0</span></p>
                </div>
            </div>
        </div>

        <!-- Properties Tab -->
        <div id="properties" class="tab-content hidden">
            <h2 class="text-3xl font-light tracking-wide mb-8">Active <span class="font-bold glow-text text-cyan-400">Assets</span></h2>
            
            <form id="prop-form" class="glass p-6 rounded-2xl mb-8 flex flex-wrap gap-4">
                <input type="text" id="p-name" placeholder="Property ID / Name" class="p-3 rounded-xl flex-1 focus:ring-0" required>
                <input type="text" id="p-tenant" placeholder="Tenant Name" class="p-3 rounded-xl flex-1 focus:ring-0" required>
                <input type="number" id="p-rent" placeholder="Rent (₹)" class="p-3 rounded-xl w-32 focus:ring-0" required>
                <input type="number" id="p-due" placeholder="Due (1-31)" class="p-3 rounded-xl w-32 focus:ring-0" required>
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-8 py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">DEPLOY</button>
            </form>
            
            <div id="prop-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- EMIs Tab -->
        <div id="emis" class="tab-content hidden">
            <h2 class="text-3xl font-light tracking-wide mb-8">Active <span class="font-bold text-rose-500" style="text-shadow: 0 0 20px rgba(244, 63, 94, 0.5);">Liabilities</span></h2>
            
            <form id="emi-form" class="glass p-6 rounded-2xl mb-8 flex flex-wrap gap-4">
                <input type="text" id="e-name" placeholder="Liability Designation" class="p-3 rounded-xl flex-1 focus:ring-0" required>
                <input type="number" id="e-amount" placeholder="Amount (₹)" class="p-3 rounded-xl w-40 focus:ring-0" required>
                <input type="number" id="e-due" placeholder="Due (1-31)" class="p-3 rounded-xl w-32 focus:ring-0" required>
                <button type="submit" class="bg-rose-500 hover:bg-rose-400 text-white font-bold px-8 py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(244,63,94,0.4)]">DEPLOY</button>
            </form>
            
            <div id="emi-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
